# force overwriting formulas
force: false

# generate config file
generate-config: false

# interactive mode
interactive: true

# disable git push
no-push: false

# Personal access token
token:
  gitlab.com: GL_PERSONAL_ACCESS_TOKEN
  github.com: GH_PERSONAL_ACCESS_TOKEN
  git.example.com: GL_EXAMPLE_PERSONAL_ACCESS_TOKEN

# verbose output
verbose: 0

hooks:
  - name: Test
    path: Path
    parameters:
      - param1
      - param2
    formulas:
      - Formula1
      - Formula2
  - name: Test2
    path: Path2
    parameters:
      - param1
      - param2
    formulas:
      - Formula1
      - Formula2
